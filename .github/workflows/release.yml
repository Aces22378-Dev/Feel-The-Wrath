# Builds the Windows installer on GitHub's Windows machines and publishes it as a release.
# Trigger: push a tag like v0.5.3  (git tag v0.5.3 && git push origin v0.5.3)
# The tag must match "version" in package.json. Installed games see the new release and ask players to update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm ci
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Check all three files were made
        shell: bash
        run: ls -la dist && ls dist/*.exe dist/*.exe.blockmap dist/latest.yml
      - name: Publish the release (installer + blockmap + latest.yml)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
