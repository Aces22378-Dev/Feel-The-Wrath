# Posts TikTok updates to Discord through the "Feel The Wrath" webhook.
#
# Automatic (videos): IFTTT (free) → TikTok "New video" → GitHub "Create an issue" in this repo,
#   title  TikTok: {{ShareUrl}}
#   This workflow posts the link to Discord and closes the issue.
# By hand: Actions → "TikTok Post" → Run workflow → pick video or story (stories can only be posted by hand).
#
# Setup — Settings → Secrets and variables → Actions:
#   Secret   TIKTOK_WEBHOOK_URL   = the Discord webhook URL (keep it secret)
#   Variable TIKTOK_PROFILE       = https://www.tiktok.com/@yourname   (used for stories when no link is given)
#   Variable TIKTOK_PING_ROLE_ID  = a role ID to ping (optional)
name: TikTok Post

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      kind:
        description: 'What did you post?'
        type: choice
        options: [video, story]
        default: video
      link:
        description: 'TikTok link (needed for a video, optional for a story)'
        required: false
        type: string

permissions:
  issues: write

jobs:
  post:
    # Issues only count when they start with "TikTok:" and were opened by the repo owner (you, through IFTTT)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'TikTok:') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.TIKTOK_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          KIND: ${{ inputs.kind }}
          LINK: ${{ inputs.link }}
          ISSUE_TEXT: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
          PROFILE: ${{ vars.TIKTOK_PROFILE }}
          ROLE: ${{ vars.TIKTOK_PING_ROLE_ID }}
        shell: python
        run: |
          import json, os, re, sys, urllib.request
          env = lambda k: (os.environ.get(k) or "").strip()
          hook, role = env("WEBHOOK"), env("ROLE")
          LINK = re.compile(r"https?://([a-z]+\.)?tiktok\.com/[^\s\"'<>)\]]+", re.I)
          if not hook:
              sys.exit("::error::Add the TIKTOK_WEBHOOK_URL secret first (Settings → Secrets and variables → Actions).")

          if env("EVENT") == "issues":
              m = LINK.search(env("ISSUE_TEXT"))
              if not m: sys.exit("::error::No TikTok link found in the issue.")
              kind, link = "video", m.group(0)
          else:
              kind, link = env("KIND") or "video", re.sub(r"\s+", "", env("LINK"))
              if kind == "story" and not link: link = env("PROFILE")
              if not link: sys.exit("::error::Paste the TikTok link (or set the TIKTOK_PROFILE variable for stories).")
              if not LINK.fullmatch(link): sys.exit(f"::error::That doesn't look like a TikTok link: {link}")

          title = "Feel The Wrath added to its story!" if kind == "story" else "Feel The Wrath has posted a new video!"
          text = (f"<@&{role}>\n" if role else "") + f"**{title}**\n\n{link}"
          body = json.dumps({"content": text, "allowed_mentions": {"parse": [], "roles": [role] if role else []}}).encode()
          req = urllib.request.Request(hook, body, {"Content-Type": "application/json", "User-Agent": "FTW-TikTok-Webhook"})
          urllib.request.urlopen(req, timeout=20).read()
          print("Posted:", title, link)

      - name: Close the IFTTT issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Posted to Discord ✅"
